name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# pages: write дозволяє воркфлоу САМОМУ увімкнути Pages при першому запуску
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (relative base — works on any Pages URL)
        run: npx vite build --base=./

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Якщо Pages ще не увімкнено — вмикаємо його автоматично (одноразово).
      # Потрібно, щоб у Settings → Actions → Workflow permissions стояло
      # "Read and write permissions" (на особистих акаунтах це дефолт).
      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          BUILD_TYPE=$(gh api "repos/$REPO/pages" --jq ".build_type" 2>/dev/null || echo "")

          case "$BUILD_TYPE" in
            workflow)
              echo "✓ GitHub Pages already uses GitHub Actions"
              ;;
            legacy)
              echo "Switching Pages to GitHub Actions source…"
              gh api -X PUT "repos/$REPO/pages" -f build_type=workflow
              ;;
            *)
              echo "GitHub Pages not enabled — enabling via API…"
              if ! gh api -X POST "repos/$REPO/pages" -f build_type=workflow; then
                echo "::error::Couldn't enable Pages automatically."
                echo "::error::Do it once manually: Settings → Pages → Build and deployment → Source → GitHub Actions"
                exit 1
              fi
              ;;
          esac

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
