name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx vite build --base=./

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"

          # Detect current Pages config. A 404 (not enabled) yields an empty value.
          RESP="$(gh api "repos/$REPO/pages" 2>/dev/null || true)"
          BUILD_TYPE="$(printf '%s' "$RESP" | jq -r '.build_type // empty' 2>/dev/null || true)"

          case "$BUILD_TYPE" in
            workflow)
              echo "✅ Pages already enabled (source: GitHub Actions)"
              exit 0
              ;;
            "")
              echo "ℹ️ Pages not enabled yet — trying to enable via API…"
              ;;
            *)
              echo "ℹ️ Pages uses legacy source '$BUILD_TYPE' — switching to GitHub Actions…"
              ;;
          esac

          if gh api -X POST "repos/$REPO/pages" -f build_type=workflow >/dev/null 2>&1; then
            echo "✅ GitHub Pages enabled"
          else
            echo ""
            echo "::error::The workflow token is read-only, so Pages can't be enabled automatically."
            echo "::error::Do this ONE time, then re-run the workflow:"
            echo "::error::  1. Open https://github.com/$REPO/settings/pages"
            echo "::error::  2. Under 'Build and deployment' → Source → select 'GitHub Actions' → Save"
            echo "::error::  3. Go to the Actions tab and click 'Re-run all jobs'"
            echo "::error::(Alternative: Settings → Actions → General → Workflow permissions → 'Read and write permissions' → Save)"
            exit 1
          fi

      - id: deployment
        uses: actions/deploy-pages@v4
