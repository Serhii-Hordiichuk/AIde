name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx vite build --base=./

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          BUILD_TYPE="$(gh api "repos/$REPO/pages" --jq .build_type 2>/dev/null || echo none)"

          if [ "$BUILD_TYPE" = "workflow" ]; then
            echo "✅ Pages already enabled (source: GitHub Actions)"
            exit 0
          fi

          if [ "$BUILD_TYPE" = "none" ]; then
            echo "ℹ️ Pages not enabled yet — enabling via API…"
          else
            echo "ℹ️ Pages uses legacy source ($BUILD_TYPE) — switching to GitHub Actions…"
          fi

          if gh api -X POST "repos/$REPO/pages" -f build_type=workflow >/dev/null 2>&1 \
             || gh api -X PUT "repos/$REPO/pages" -f build_type=workflow >/dev/null 2>&1; then
            echo "✅ GitHub Pages enabled"
          else
            echo ""
            echo "::error::Could not enable Pages automatically (token is read-only)."
            echo "::error::Do ONE of these once, then re-run this workflow:"
            echo "::error::  A) https://github.com/$REPO/settings/actions  →  'Workflow permissions'  →  select 'Read and write permissions'  →  Save."
            echo "::error::  B) https://github.com/$REPO/settings/pages  →  'Build and deployment'  →  Source: 'GitHub Actions'."
            echo "::error::Then open the Actions tab and click 'Re-run all jobs'."
            exit 1
          fi

      - id: deployment
        uses: actions/deploy-pages@v4
